monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.pci-0000_00_05.0*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~v4l2_input.pci-0000_00_05.0*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

monitor.libcamera.rules = [
  {
    matches = [
      { device.description = "ov7251" }
      { device.product.name = "ov7251" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.description = "ov7251" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
